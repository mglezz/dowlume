ily="Arial">Historical Recycle is never replayed: an intact expected source permits Failed;</text><text x="176.565" y="576.428" fill="#000" font-size="14" textLength="509.763" font-family="Arial">absent or changed content remains NeedsAttention, regardless of any destination.</text><text x="176.565" y="592.526" fill="#000" font-size="14" textLength="438.115" font-family="Arial">Native Recycle is disabled in v0.1.0; refused calls create no Operation.</text><text x="176.565" y="608.625" fill="#000" font-size="14" textLength="624.135" font-family="Arial">Cancellation before recording creates no Operation. Unresolved attempts block the affected file/path.</text></g></g></svg>