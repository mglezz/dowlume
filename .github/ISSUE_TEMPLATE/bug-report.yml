name: Bug report
description: Report a reproducible problem with Dowlume.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Please use disposable samples. Do not attach personal downloads, the local database, or unredacted file paths."
  - type: input
    id: version
    attributes:
      label: Dowlume version and package
      placeholder: "0.4.0, macOS app / Windows installer / portable ZIP / Linux preview"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system, version, and architecture
      description: "For example: Windows 11 x64, macOS 15 Apple Silicon, or Ubuntu 24.04 x64. For Linux, include the desktop and display session."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "Include the action, file extension, filesystem, and whether source and destination are on different volumes. Use fictional filenames."
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual result
      description: "Include any visible error and whether the sample file remains at its source, destination, or review folder."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: "Optional redacted screenshots, display scaling, and whether the problem happens after restarting."
