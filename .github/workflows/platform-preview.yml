name: Package macOS and Linux preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Dowlume/**'
      - 'packaging/**'
      - 'docs/USER_GUIDE.md'
      - 'docs/es/USER_GUIDE.md'
      - 'docs/PLATFORM_SUPPORT.md'
      - 'docs/es/PLATFORM_SUPPORT.md'
      - 'docs/RELEASE_NOTES_*.md'
      - 'docs/es/RELEASE_NOTES_*.md'
      - 'scripts/Build-PlatformPreview.py'
      - '.github/workflows/platform-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    name: Preview ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            runtime: osx-arm64
          - runner: ubuntu-24.04
            runtime: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux native desktop smoke-test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libx11-6 libice6 libsm6 libfontconfig1 libgl1 libegl1 libxrandr2 libxi6 libxcursor1 libxrender1 libxext6 libxfixes3
      - name: Build native archive and launch its extracted application
        run: python scripts/Build-PlatformPreview.py --runtime ${{ matrix.runtime }} --output artifacts/platform-preview
      - uses: actions/upload-artifact@v4
        with:
          name: platform-preview-${{ matrix.runtime }}
          path: |
            artifacts/platform-preview/*.zip
            artifacts/platform-preview/*.tar.gz
            artifacts/platform-preview/BUILD-INFO.*.json
            artifacts/platform-preview/ACCEPTANCE.*.json
            artifacts/platform-preview/SHA256SUMS.*.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preview-diagnostics-${{ matrix.runtime }}
          path: |
            artifacts/platform-preview/BUILD-INFO.*.json
            artifacts/platform-preview/smoke-profile-*/diagnostics.jsonl
