name: Package Windows candidate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'Dowlume.slnx'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/package.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Read package version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/Dowlume.App/Dowlume.App.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Download and verify the published upgrade baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts/upgrade-baseline | Out-Null
          $installer = 'artifacts/upgrade-baseline/Dowlume-0.3.0-win-x64-setup.exe'
          Invoke-WebRequest 'https://github.com/mglezz/dowlume/releases/download/v0.3.0/Dowlume-0.3.0-win-x64-setup.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '1E72330B1ED1C662CDBAB9FA93511626F736488067D261F07683443A08826CD3') {
            throw 'The published v0.3.0 upgrade baseline does not match its accepted hash.'
          }
      - name: Build tested release packages
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -RequireInstaller -OutputDirectory artifacts/release-candidate
      - name: Verify upgrade, languages, portable startup, running-app guards, and uninstall
        shell: pwsh
        env:
          DOWLUME_PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          ./scripts/Test-WindowsPackage.ps1 `
            -Installer "artifacts/release-candidate/Dowlume-$($env:DOWLUME_PACKAGE_VERSION)-win-x64-setup.exe" `
            -Archive "artifacts/release-candidate/Dowlume-$($env:DOWLUME_PACKAGE_VERSION)-win-x64.zip" `
            -PreviousInstaller artifacts/upgrade-baseline/Dowlume-0.3.0-win-x64-setup.exe `
            -ReportPath artifacts/acceptance/package.json -RequireLocalization
      - uses: actions/upload-artifact@v4
        with:
          name: Dowlume-${{ steps.version.outputs.value }}-win-x64
          path: |
            artifacts/release-candidate/*.zip
            artifacts/release-candidate/*.exe
            artifacts/release-candidate/SHA256SUMS.txt
            artifacts/release-candidate/BUILD-INFO.json
            artifacts/release-candidate/RELEASE_NOTES_*.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-package-acceptance
          path: artifacts/acceptance/
